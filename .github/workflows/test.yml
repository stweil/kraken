name: Lint and test

on:
  # push:
  workflow_dispatch:
    inputs:
      python-versions:
        description: 'Python versions to test, space separated: all or any of 3.10, 3.11, 3.12, 3.13, 3.14'
        required: true
        default: 'all'
        type: string
      runners:
        description: 'Runners to test on, space separated: all, ubuntu-latest, ubuntu-24.04-arm'
        required: true
        default: 'all'
        type: string

jobs:
  lint_and_test:
    name: Runs the linter and tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']
    steps:
      - id: selected
        name: Check if this combination was selected
        env:
          EVENT: ${{ github.event_name }}
          PY: ${{ inputs.python-versions }}
          RUN: ${{ inputs.runners }}
          M_PY: ${{ matrix.python-version }}
          M_RUN: ${{ matrix.runner }}
        run: |
          selected=true
          if [ "$EVENT" = "workflow_dispatch" ]; then
            selected=false
            if { [ "$PY" = "all" ] || echo " $PY " | grep -q " $M_PY "; } && { [ "$RUN" = "all" ] || echo " $RUN " | grep -q " $M_RUN "; }; then
              selected=true
            fi
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: ${{ steps.selected.outputs.selected == 'true' }}
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        if: ${{ steps.selected.outputs.selected == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and kraken
        if: ${{ steps.selected.outputs.selected == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install .[test] flake8
      - name: Lint with flake8
        if: ${{ steps.selected.outputs.selected == 'true' }}
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests, except training tests
        if: ${{ steps.selected.outputs.selected == 'true' }}
        run: |
          pytest -k 'not test_train'

  publish-gh-pages:
    name: Update kraken.re github pages
    needs: lint_and_test
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/'))

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install docs dependencies
        run: |
          pip install .[docs]
      - name: Create docs
        run:  sphinx-multiversion docs build/html
        env:
          SPHINX_GITHUB_CHANGELOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create redirect
        run: cp docs/redirect.html build/html/index.html
      - name: Push gh-pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: build/html
          fqdn: kraken.re
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    needs: lint_and_test
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kraken
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
